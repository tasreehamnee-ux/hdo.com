<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>وحدة التصاريح الأمنية - استمارة الانشطة الشهرية - استمارة إلكترونية</title>
        <title>استمارة الانشطة الشهرية</title>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', 'Tahoma', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white;
            padding: 30px;
            text-align: center;
            position: relative;
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .header .subtitle {
            font-size: 18px;
            opacity: 0.9;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            padding: 20px;
            background: #f8f9fa;
            border-bottom: 2px solid #e9ecef;
            flex-wrap: wrap;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .control-group label {
            font-weight: bold;
            color: #2a5298;
            font-size: 14px;
        }

        select {
            padding: 10px 15px;
            border: 2px solid #2a5298;
            border-radius: 8px;
            font-size: 16px;
            background: white;
            cursor: pointer;
            min-width: 180px;
            transition: all 0.3s;
        }

        select:hover, select:focus {
            border-color: #1e3c72;
            box-shadow: 0 0 10px rgba(42, 82, 152, 0.2);
        }

        .btn {
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-success {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            color: white;
        }

        .btn-warning {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
        }

        .btn-info {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .form-container {
            padding: 30px;
            overflow-x: auto;
        }

        /* الجدول يبدأ من اليمين إلى اليسار (RTL) */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            background: white;
            direction: rtl;
        }

        th {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white;
            padding: 15px 10px;
            text-align: center;
            font-weight: bold;
            border: 2px solid #1e3c72;
            font-size: 14px;
            min-width: 120px;
        }

        td {
            border: 2px solid #dee2e6;
            padding: 8px;
            text-align: center;
            vertical-align: top;
        }

        /* الحقول تتكيف مع المحتوى */
        td input, td textarea {
            width: 100%;
            min-width: 120px;
            padding: 8px;
            border: 1px solid #ced4da;
            border-radius: 4px;
            font-size: 14px;
            text-align: center;
            transition: all 0.3s;
            resize: none;
            overflow: hidden;
        }

        /* textarea تتوسع تلقائياً */
        td textarea {
            min-height: 40px;
            height: auto;
            field-sizing: content;
            overflow-y: hidden;
        }

        td input:focus, td textarea:focus {
            border-color: #2a5298;
            box-shadow: 0 0 8px rgba(42, 82, 152, 0.2);
            outline: none;
        }

        /* input من نوع text يتوسع تلقائياً */
        td input[type="text"] {
            min-width: 120px;
            width: 100%;
        }

        /* عمود التسلسل - عرض مخفض */
        .row-number {
            background: #e9ecef;
            font-weight: bold;
            color: #2a5298;
            width: 35px;          /* عرض مخفض من 50px إلى 35px */
            min-width: 35px;      /* عرض أدنى مخفض */
            max-width: 35px;      /* عرض أقصى مخفض */
            text-align: center;
            font-size: 13px;      /* خط أصغر قليلاً */
            padding: 8px 2px;     /* هوامش أقل جانبياً */
        }

        /* تعديل عرض العمود الأول في thead */
        th:first-child {
            width: 35px;
            min-width: 35px;
            max-width: 35px;
            padding: 15px 2px;
            font-size: 13px;
        }

        .add-row-btn {
            margin: 20px auto;
            display: block;
        }

        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #ff6b6b;
            color: white;
            padding: 15px 25px;
            border-radius: 10px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.3);
            display: none;
            z-index: 1000;
            animation: slideIn 0.5s ease;
        }

        @keyframes slideIn {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        .notification.show {
            display: block;
        }

        .notification.success {
            background: #38ef7d;
        }

        .notification.info {
            background: #4facfe;
        }

        .auto-save-indicator {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background: #38ef7d;
            color: white;
            padding: 10px 20px;
            border-radius: 20px;
            display: none;
            z-index: 1000;
            font-size: 14px;
        }

        .auto-save-indicator.show {
            display: block;
            animation: fadeInOut 2s ease;
        }

        @keyframes fadeInOut {
            0%, 100% { opacity: 0; }
            50% { opacity: 1; }
        }

        .whatsapp-btn {
            background: linear-gradient(135deg, #25d366 0%, #128c7e 100%) !important;
        }

        /* خلايا الجدول تتكيف مع المحتوى */
        td {
            height: auto;
            min-height: 40px;
        }

        @media print {
            body {
                background: white;
            }
            .controls, .add-row-btn, .notification, .auto-save-indicator {
                display: none !important;
            }
            .container {
                box-shadow: none;
            }
            td textarea, td input {
                overflow: visible !important;
                height: auto !important;
                resize: none !important;
                border: none !important;
                background: transparent !important;
            }
        }

        @media (max-width: 768px) {
            .controls {
                flex-direction: column;
                align-items: stretch;
            }

            th, td {
                font-size: 12px;
                padding: 5px;
            }

            .header h1 {
                font-size: 20px;
            }

            /* عرض أصغر للشاشات الصغيرة */
            .row-number, th:first-child {
                width: 30px;
                min-width: 30px;
                max-width: 30px;
                font-size: 11px;
            }
        }
    </style>

<body>
    <div class="notification" id="notification">
        ⚠️ تنبيه: نهاية الشهر! يرجى سحب الاستمارة وإرسالها
    </div>

    <div class="auto-save-indicator" id="autoSaveIndicator">
        ✅ تم الحفظ تلقائياً
    </div>

    <div class="container">
        <div class="header">
            <h1>وحدة التصاريح الأمنية</h1>
            <h2 style="font-size: 22px; margin-bottom: 10px; text-shadow: 2px 2px 4px rgba(0,0,0,0.3);">استمارة الانشطة الشهرية</h2>
            <div class="subtitle">محافظة <span id="selectedGovernorate">( )</span> - لشهر <span id="selectedMonth">( )</span></div>
        </div>

        <div class="controls">
            <div class="control-group">
                <label>المحافظة:</label>
                <select id="governorateSelect">
                    <option value="">اختر المحافظة</option>
                    <option value="بغداد">بغداد</option>
                    <option value="البصرة">البصرة</option>
                    <option value="نينوى">نينوى</option>
                    <option value="النجف">النجف</option>
                    <option value="ذي قار">ذي قار</option>
                    <option value="كركوك">كركوك</option>
                    <option value="الأنبار">الأنبار</option>
                    <option value="ديالى">ديالى</option>
                    <option value="المثنى">المثنى</option>
                    <option value="القادسية">القادسية</option>
                    <option value="ميسان">ميسان</option>
                    <option value="واسط">واسط</option>
                    <option value="صلاح الدين">صلاح الدين</option>
                    <option value="بابل">بابل</option>
                    <option value="كربلاء">كربلاء</option>
                </select>
            </div>

            <div class="control-group">
                <label>الشهر:</label>
                <select id="monthSelect">
                    <option value="">اختر الشهر</option>
                    <option value="كانون الثاني">كانون الثاني</option>
                    <option value="شباط">شباط</option>
                    <option value="آذار">آذار</option>
                    <option value="نيسان">نيسان</option>
                    <option value="أيار">أيار</option>
                    <option value="حزيران">حزيران</option>
                    <option value="تموز">تموز</option>
                    <option value="آب">آب</option>
                    <option value="أيلول">أيلول</option>
                    <option value="تشرين الأول">تشرين الأول</option>
                    <option value="تشرين الثاني">تشرين الثاني</option>
                    <option value="كانون الأول">كانون الأول</option>
                </select>
            </div>

            <button class="btn btn-primary" onclick="addRow()">
                ➕ إضافة صف
            </button>

            <button class="btn btn-success" onclick="savePDF()" id="savePdfBtn">
                💾 حفظ PDF
            </button>

            <button class="btn btn-info" onclick="exportToPDF()" id="exportPdfBtn">
                📄 تصدير PDF
            </button>


            <button class="btn btn-primary" onclick="clearAll()">
                🗑️ مسح الكل
            </button>
        </div>

        <div class="form-container" id="formContainer">
            <table id="dataTable">
                <thead>
                    <tr>
                        <th>ت</th>
                        <th>المهام والواجبات</th>
                        <th>عدد الموظفين القائمين بالخدمة</th>
                        <th>عدد الأعمال ضمن الخطة</th>
                        <th>نسبة الإنجاز أو عدد المنجز</th>
                        <th>القسم</th>
                        <th>الشعبة</th>
                        <th>الجهة المستفيدة</th>
                        <th>الجهة الساندة</th>
                        <th>تاريخ التنفيذ</th>

                    </tr>
                </thead>
                <tbody id="tableBody">
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const { jsPDF } = window.jspdf;
                let accumulatedPDFData = { governorate: '', month: '', rows: [] };

        function autoResizeTextarea(element) {
            element.style.height = 'auto';
            element.style.height = element.scrollHeight + 'px';
        }

        function autoResizeInput(element) {
            const tempSpan = document.createElement('span');
            tempSpan.style.cssText = 'visibility:hidden;position:absolute;white-space:nowrap;';
            tempSpan.style.fontSize = window.getComputedStyle(element).fontSize;
            tempSpan.style.fontFamily = window.getComputedStyle(element).fontFamily;
            tempSpan.textContent = element.value || element.placeholder;
            document.body.appendChild(tempSpan);
            const newWidth = Math.max(tempSpan.offsetWidth + 30, 120);
            element.style.width = newWidth + 'px';
            document.body.removeChild(tempSpan);
        }

        function loadSavedData() {
            try {
                const saved = localStorage.getItem('securityFormData');
                const savedPDF = localStorage.getItem('accumulatedPDFData');
                if (savedPDF) accumulatedPDFData = JSON.parse(savedPDF);
                if (saved) {
                    const data = JSON.parse(saved);
                    document.getElementById('governorateSelect').value = data.governorate || '';
                    document.getElementById('monthSelect').value = data.month || '';
                    updateHeader();
                    if (data.rows && data.rows.length > 0) {
                        data.rows.forEach(row => addRowWithData(row));
                    } else {
                        addRow();
                    }
                } else {
                    addRow();
                }
            } catch (e) {
                console.error('Error loading saved data:', e);
                addRow();
            }
        }

        function autoSave() {
            try {
                const rows = [];
                const tbody = document.getElementById('tableBody');
                const trs = tbody.querySelectorAll('tr');
                trs.forEach(tr => {
                    const inputs = tr.querySelectorAll('input, textarea');
                    rows.push({
                        rowNum: tr.querySelector('.row-number').textContent,
                        tasks: inputs[0].value,
                        employees: inputs[1].value,
                        planned: inputs[2].value,
                        completion: inputs[3].value,
                        section: inputs[4].value,
                        department: inputs[5].value,
                        beneficiary: inputs[6].value,
                        supporting: inputs[7].value,
                        date: inputs[8].value,
                    });
                });
                const data = {
                    governorate: document.getElementById('governorateSelect').value,
                    month: document.getElementById('monthSelect').value,
                    rows: rows,
                    lastSaved: new Date().toISOString()
                };
                localStorage.setItem('securityFormData', JSON.stringify(data));
                const indicator = document.getElementById('autoSaveIndicator');
                indicator.classList.add('show');
                setTimeout(() => indicator.classList.remove('show'), 2000);
            } catch (e) {
                console.error('Error saving data:', e);
            }
        }

        function addRow() {
            const tbody = document.getElementById('tableBody');
            const rowCount = tbody.children.length + 1;
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td class="row-number">${rowCount}</td>
                <td><textarea placeholder="المهام والواجبات" oninput="autoSave(); autoResizeTextarea(this)"></textarea></td>
                <td><input type="number" oninput="autoSave()" placeholder="عدد الموظفين"></td>
                <td><input type="number" oninput="autoSave()" placeholder="عدد الأعمال"></td>
                <td><input type="text" oninput="autoSave(); autoResizeInput(this)" placeholder="نسبة الإنجاز"></td>
                <td><input type="text" oninput="autoSave(); autoResizeInput(this)" placeholder="القسم"></td>
                <td><input type="text" oninput="autoSave(); autoResizeInput(this)" placeholder="الشعبة"></td>
                <td><input type="text" oninput="autoSave(); autoResizeInput(this)" placeholder="الجهة المستفيدة"></td>
                <td><input type="text" oninput="autoSave(); autoResizeInput(this)" placeholder="الجهة الساندة"></td>
                <td><input type="date" onchange="autoSave()" placeholder="تاريخ التنفيذ"></td>
            `;
            tbody.appendChild(tr);
            autoSave();
        }

        function addRowWithData(data) {
            const tbody = document.getElementById('tableBody');
            const rowCount = tbody.children.length + 1;
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td class="row-number">${rowCount}</td>
                <td><textarea placeholder="المهام والواجبات" oninput="autoSave(); autoResizeTextarea(this)">${data.tasks || ''}</textarea></td>
                <td><input type="number" oninput="autoSave()" value="${data.employees || ''}" placeholder="عدد الموظفين"></td>
                <td><input type="number" oninput="autoSave()" value="${data.planned || ''}" placeholder="عدد الأعمال"></td>
                <td><input type="text" oninput="autoSave(); autoResizeInput(this)" value="${data.completion || ''}" placeholder="نسبة الإنجاز"></td>
                <td><input type="text" oninput="autoSave(); autoResizeInput(this)" value="${data.section || ''}" placeholder="القسم"></td>
                <td><input type="text" oninput="autoSave(); autoResizeInput(this)" value="${data.department || ''}" placeholder="الشعبة"></td>
                <td><input type="text" oninput="autoSave(); autoResizeInput(this)" value="${data.beneficiary || ''}" placeholder="الجهة المستفيدة"></td>
                <td><input type="text" oninput="autoSave(); autoResizeInput(this)" value="${data.supporting || ''}" placeholder="الجهة الساندة"></td>
                <td><input type="date" onchange="autoSave()" value="${data.date || ''}"></td>
            `;
            tbody.appendChild(tr);
            setTimeout(() => {
                tr.querySelectorAll('textarea').forEach(ta => autoResizeTextarea(ta));
                tr.querySelectorAll('input[type="text"]').forEach(inp => autoResizeInput(inp));
            }, 10);
        }

        function updateHeader() {
            const gov = document.getElementById('governorateSelect').value || '( )';
            const month = document.getElementById('monthSelect').value || '( )';
            document.getElementById('selectedGovernorate').textContent = gov;
            document.getElementById('selectedMonth').textContent = month;
            autoSave();
        }

        function collectCurrentData() {
            const rows = [];
            const tbody = document.getElementById('tableBody');
            const trs = tbody.querySelectorAll('tr');
            trs.forEach(tr => {
                const inputs = tr.querySelectorAll('input, textarea');
                rows.push({
                    rowNum: tr.querySelector('.row-number').textContent,
                    tasks: inputs[0].value,
                    employees: inputs[1].value,
                    planned: inputs[2].value,
                    completion: inputs[3].value,
                    section: inputs[4].value,
                    department: inputs[5].value,
                    beneficiary: inputs[6].value,
                    supporting: inputs[7].value,
                    date: inputs[8].value,
                });
            });
            return rows;
        }

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        async function createPDF(governorate, month, rows, type) {
            try {
                const ROWS_PER_PAGE = 12;

                if (!rows || rows.length === 0) {
                    showNotification('⚠️ لا توجد بيانات لإنشاء PDF', 'error');
                    return null;
                }

                const totalPages = Math.ceil(rows.length / ROWS_PER_PAGE);
                const pdf = new jsPDF({ orientation: 'landscape', unit: 'mm', format: 'a4' });

                // Create a hidden container for rendering
                let hiddenContainer = document.getElementById('pdfRenderContainer');
                if (!hiddenContainer) {
                    hiddenContainer = document.createElement('div');
                    hiddenContainer.id = 'pdfRenderContainer';
                    hiddenContainer.style.cssText = 'position:fixed;left:-10000px;top:0;width:1200px;background:white;padding:20px;direction:rtl;z-index:-9999;overflow:hidden;';
                    document.body.appendChild(hiddenContainer);
                }

                for (let page = 0; page < totalPages; page++) {
                    if (page > 0) {
                        pdf.addPage();
                    }

                    const pageRows = rows.slice(page * ROWS_PER_PAGE, (page + 1) * ROWS_PER_PAGE);

                    let tableHTML = `
                        <div style="text-align:center;margin-bottom:12px;direction:rtl;font-family:Arial,Tahoma,sans-serif;">
                            <div style="color:#1e3c72;font-size:24px;font-weight:bold;margin-bottom:6px;">وحدة التصاريح الأمنية</div>
                            <div style="color:#1e3c72;font-size:20px;font-weight:bold;margin-bottom:6px;">استمارة الانشطة الشهرية</div>
                            <div style="color:#2a5298;font-size:16px;font-weight:bold;margin-bottom:6px;">محافظة ${governorate} - ${month}</div>
                            <div style="color:#666;font-size:11px;">تاريخ الإنشاء: ${new Date().toLocaleDateString('ar-IQ')} | نوع العملية: ${type} ${type === 'حفظ' ? '(تراكمي)' : '(فوري)'} | عدد السجلات: ${rows.length} | صفحة ${page + 1} من ${totalPages}</div>
                        </div>
                        <table style="width:100%;border-collapse:collapse;direction:rtl;font-family:Arial,Tahoma,sans-serif;table-layout:fixed;">
                            <thead>
                                <tr style="background:#1e3c72;color:white;">
                                    <th style="border:2px solid #1e3c72;padding:8px 3px;text-align:center;font-size:13px;width:35px;">ت</th>
                                    <th style="border:2px solid #1e3c72;padding:8px;text-align:center;font-size:13px;width:180px;">المهام والواجبات</th>
                                    <th style="border:2px solid #1e3c72;padding:8px;text-align:center;font-size:13px;width:70px;">عدد الموظفين</th>
                                    <th style="border:2px solid #1e3c72;padding:8px;text-align:center;font-size:13px;width:70px;">عدد الأعمال</th>
                                    <th style="border:2px solid #1e3c72;padding:8px;text-align:center;font-size:13px;width:80px;">نسبة الإنجاز</th>
                                    <th style="border:2px solid #1e3c72;padding:8px;text-align:center;font-size:13px;width:90px;">القسم</th>
                                    <th style="border:2px solid #1e3c72;padding:8px;text-align:center;font-size:13px;width:90px;">الشعبة</th>
                                    <th style="border:2px solid #1e3c72;padding:8px;text-align:center;font-size:13px;width:100px;">الجهة المستفيدة</th>
                                    <th style="border:2px solid #1e3c72;padding:8px;text-align:center;font-size:13px;width:100px;">الجهة الساندة</th>
                                    <th style="border:2px solid #1e3c72;padding:8px;text-align:center;font-size:13px;width:90px;">تاريخ التنفيذ</th>
                                </tr>
                            </thead>
                            <tbody>
                    `;

                    pageRows.forEach((row, index) => {
                        const bgColor = index % 2 === 0 ? '#ffffff' : '#f8f9fa';
                        const globalIndex = page * ROWS_PER_PAGE + index;
                        tableHTML += `
                            <tr style="background:${bgColor};">
                                <td style="border:1px solid #dee2e6;padding:7px 3px;text-align:center;font-size:12px;width:35px;word-wrap:break-word;">${globalIndex + 1}</td>
                                <td style="border:1px solid #dee2e6;padding:7px;text-align:center;font-size:12px;width:180px;word-wrap:break-word;">${escapeHtml(row.tasks || '')}</td>
                                <td style="border:1px solid #dee2e6;padding:7px;text-align:center;font-size:12px;width:70px;word-wrap:break-word;">${escapeHtml(row.employees || '')}</td>
                                <td style="border:1px solid #dee2e6;padding:7px;text-align:center;font-size:12px;width:70px;word-wrap:break-word;">${escapeHtml(row.planned || '')}</td>
                                <td style="border:1px solid #dee2e6;padding:7px;text-align:center;font-size:12px;width:80px;word-wrap:break-word;">${escapeHtml(row.completion || '')}</td>
                                <td style="border:1px solid #dee2e6;padding:7px;text-align:center;font-size:12px;width:90px;word-wrap:break-word;">${escapeHtml(row.section || '')}</td>
                                <td style="border:1px solid #dee2e6;padding:7px;text-align:center;font-size:12px;width:90px;word-wrap:break-word;">${escapeHtml(row.department || '')}</td>
                                <td style="border:1px solid #dee2e6;padding:7px;text-align:center;font-size:12px;width:100px;word-wrap:break-word;">${escapeHtml(row.beneficiary || '')}</td>
                                <td style="border:1px solid #dee2e6;padding:7px;text-align:center;font-size:12px;width:100px;word-wrap:break-word;">${escapeHtml(row.supporting || '')}</td>
                                <td style="border:1px solid #dee2e6;padding:7px;text-align:center;font-size:12px;width:90px;word-wrap:break-word;">${escapeHtml(row.date || '')}</td>
                            </tr>
                        `;
                    });

                    tableHTML += '</tbody></table>';
                    hiddenContainer.innerHTML = tableHTML;

                    // Force layout calculation
                    hiddenContainer.offsetHeight;

                    await new Promise(resolve => setTimeout(resolve, 100));

                    const canvas = await html2canvas(hiddenContainer, {
                        scale: 2,
                        useCORS: true,
                        logging: false,
                        allowTaint: true,
                        backgroundColor: '#ffffff',
                        width: 1200,
                        height: hiddenContainer.scrollHeight,
                        windowWidth: 1200,
                        windowHeight: hiddenContainer.scrollHeight
                    });

                    const imgData = canvas.toDataURL('image/png');
                    const pdfWidth = pdf.internal.pageSize.getWidth();
                    const pdfHeight = pdf.internal.pageSize.getHeight();
                    const margin = 8;
                    const availableWidth = pdfWidth - (margin * 2);
                    const availableHeight = pdfHeight - (margin * 2);

                    const imgWidth = canvas.width;
                    const imgHeight = canvas.height;
                    const ratio = Math.min(availableWidth / imgWidth, availableHeight / imgHeight);

                    const imgX = margin + (availableWidth - imgWidth * ratio) / 2;
                    const imgY = margin;

                    pdf.addImage(imgData, 'PNG', imgX, imgY, imgWidth * ratio, imgHeight * ratio);
                }

                // Clean up
                hiddenContainer.innerHTML = '';

                const fileName = `تصاريح_${governorate}_${month}_${type}_${new Date().toISOString().split('T')[0]}.pdf`;

                return {
                    pdf: pdf,
                    fileName: fileName,
                    blob: pdf.output('blob')
                };
            } catch (error) {
                console.error('Error creating PDF:', error);
                showNotification('❌ حدث خطأ أثناء إنشاء PDF: ' + error.message, 'error');
                return null;
            }
        }

        function isDuplicateRow(row1, row2) {
            return row1.tasks === row2.tasks &&
                   row1.employees === row2.employees &&
                   row1.planned === row2.planned &&
                   row1.completion === row2.completion &&
                   row1.section === row2.section &&
                   row1.department === row2.department &&
                   row1.beneficiary === row2.beneficiary &&
                   row1.supporting === row2.supporting &&
                   row1.date === row2.date;
        }

        function filterDuplicateRows(newRows, existingRows) {
            const filtered = [];
            let duplicateCount = 0;

            newRows.forEach(newRow => {
                // Check if this row already exists in accumulated data
                const isDup = existingRows.some(existingRow => isDuplicateRow(newRow, existingRow));
                if (isDup) {
                    duplicateCount++;
                } else {
                    filtered.push(newRow);
                }
            });

            return { filtered, duplicateCount };
        }

        async function savePDF() {
            const btn = document.getElementById('savePdfBtn');
            btn.disabled = true;
            btn.textContent = '⏳ جاري الحفظ...';

            try {
                const governorate = document.getElementById('governorateSelect').value || 'غير محدد';
                const month = document.getElementById('monthSelect').value || 'غير محدد';
                const currentRows = collectCurrentData();

                if (!accumulatedPDFData.governorate) accumulatedPDFData.governorate = governorate;
                if (!accumulatedPDFData.month) accumulatedPDFData.month = month;

                // Filter out duplicate rows before adding to accumulated data
                const { filtered: uniqueRows, duplicateCount } = filterDuplicateRows(currentRows, accumulatedPDFData.rows);

                if (uniqueRows.length === 0 && currentRows.length > 0) {
                    showNotification(`⚠️ جميع السجلات (${currentRows.length}) مكررة ولم تتم إضافتها`, 'info');
                    btn.disabled = false;
                    btn.textContent = '💾 حفظ PDF';
                    return;
                }

                accumulatedPDFData.rows = [...accumulatedPDFData.rows, ...uniqueRows];
                localStorage.setItem('accumulatedPDFData', JSON.stringify(accumulatedPDFData));

                const result = await createPDF(accumulatedPDFData.governorate, accumulatedPDFData.month, accumulatedPDFData.rows, 'حفظ');

                if (result) {
                    result.pdf.save(result.fileName);
                    let msg = `✅ تم حفظ PDF بشكل تراكمي (${accumulatedPDFData.rows.length} سجل)`;
                    if (duplicateCount > 0) {
                        msg += ` - تم تخطي ${duplicateCount} سجل مكرر`;
                    }
                    showNotification(msg, 'success');
                }
            } catch (error) {
                console.error('Error saving PDF:', error);
                showNotification('❌ حدث خطأ أثناء الحفظ', 'error');
            } finally {
                btn.disabled = false;
                btn.textContent = '💾 حفظ PDF';
            }
        }

        async function exportToPDF() {
            const btn = document.getElementById('exportPdfBtn');
            btn.disabled = true;
            btn.textContent = '⏳ جاري التصدير...';

            try {
                const governorate = document.getElementById('governorateSelect').value || 'غير محدد';
                const month = document.getElementById('monthSelect').value || 'غير محدد';
                const currentRows = collectCurrentData();

                const result = await createPDF(governorate, month, currentRows, 'تصدير');

                if (result) {
                    result.pdf.save(result.fileName);
                    showNotification(`✅ تم تصدير PDF (${currentRows.length} سجل)`, 'success');
                }
            } catch (error) {
                console.error('Error exporting PDF:', error);
                showNotification('❌ حدث خطأ أثناء التصدير', 'error');
            } finally {
                btn.disabled = false;
                btn.textContent = '📄 تصدير PDF';
            }
        }

        function showNotification(message, type = 'info') {
            const notification = document.getElementById('notification');
            notification.innerHTML = message;
            notification.className = 'notification show ' + type;
            setTimeout(() => {
                notification.classList.remove('show');
            }, 5000);
        }

        function clearAll() {
            if (confirm('هل أنت متأكد من مسح جميع البيانات؟')) {
                localStorage.removeItem('securityFormData');
                localStorage.removeItem('accumulatedPDFData');
                accumulatedPDFData = { governorate: '', month: '', rows: [] };
                document.getElementById('tableBody').innerHTML = '';
                document.getElementById('governorateSelect').value = '';
                document.getElementById('monthSelect').value = '';
                updateHeader();
                addRow();
                showNotification('🗑️ تم مسح جميع البيانات', 'success');
            }
        }

        function checkMonthEnd() {
            const now = new Date();
            const lastDay = new Date(now.getFullYear(), now.getMonth() + 1, 0);
            const daysUntilEnd = Math.ceil((lastDay - now) / (1000 * 60 * 60 * 24));

            if (daysUntilEnd <= 3) {
                const notification = document.getElementById('notification');
                notification.innerHTML = `⚠️ تنبيه: باقي ${daysUntilEnd} يوم على نهاية الشهر! يرجى سحب الاستمارة وإرسالها`;
                notification.classList.add('show');
                setTimeout(() => {
                    notification.classList.remove('show');
                }, 10000);
            }
        }

        document.getElementById('governorateSelect').addEventListener('change', updateHeader);
        document.getElementById('monthSelect').addEventListener('change', updateHeader);

        window.addEventListener('load', () => {
            loadSavedData();
            checkMonthEnd();
            setInterval(checkMonthEnd, 3600000);
        });

        setInterval(autoSave, 30000);
    </script>
</body>
